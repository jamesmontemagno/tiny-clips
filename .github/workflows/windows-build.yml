name: Windows Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  changes:
    name: Detect Windows changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      windows: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.windows }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            windows:
              - 'windows/**'
              - '.github/workflows/windows-build.yml'
          base: ${{ github.ref }}

  build:
    name: Build (Windows, ${{ matrix.platform }})
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore app for ${{ matrix.platform }}
        run: dotnet restore windows/src/TinyClips.App/TinyClips.App.csproj -p:Configuration=Release -p:Platform=${{ matrix.platform }}

      - name: Build app for ${{ matrix.platform }}
        run: dotnet build windows/src/TinyClips.App/TinyClips.App.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore

  test:
    name: Run Core Tests
    runs-on: windows-latest
    needs: [changes, build]
    if: ${{ needs.changes.outputs.windows == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore test project
        run: dotnet restore windows/tests/TinyClips.Core.Tests/TinyClips.Core.Tests.csproj

      - name: Run tests
        run: dotnet test windows/tests/TinyClips.Core.Tests/TinyClips.Core.Tests.csproj -c Release --no-restore

  no-windows-changes:
    name: Build skipped (no Windows changes)
    needs: changes
    if: ${{ needs.changes.outputs.windows != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Report successful skip
        run: echo "No Windows files changed; skipping the Windows build and tests."
