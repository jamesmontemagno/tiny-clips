name: Build

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  SCHEME: TinyClips

jobs:
  changes:
    name: Detect macOS changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      mac: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mac }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Filter changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            mac:
              - 'mac/**'
              - '.github/workflows/build.yml'
          base: ${{ github.ref }}

  build:
    needs: changes
    if: ${{ needs.changes.outputs.mac == 'true' }}
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/*.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project mac/${{ env.SCHEME }}.xcodeproj \
            -scheme ${{ env.SCHEME }}

      - name: Build project
        run: |
          xcodebuild build \
            -project mac/${{ env.SCHEME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test \
            -project mac/${{ env.SCHEME }}.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  no-macos-changes:
    name: Build skipped (no macOS changes)
    needs: changes
    if: ${{ needs.changes.outputs.mac != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Report successful skip
        run: echo "No macOS files changed; skipping the macOS build."
