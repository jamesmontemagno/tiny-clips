name: Windows Release

on:
  push:
    tags:
      - 'v*-windows'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Windows release tag (for example, v1.0.1-windows)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: windows-release
  cancel-in-progress: false
  queue: max

env:
  APP_PROJECT: windows/src/TinyClips.App/TinyClips.App.csproj
  PACKAGE_FAMILY_NAME: Refractored.TinyClips_vmshqmcyy894t
  SIGNTOOL_TIMESTAMP_URL: http://timestamp.acs.microsoft.com
  # Highest WindowsAppRuntime 1.8 version installable via winget's Microsoft.WindowsAppRuntime.1.8
  # (manifests/m/Microsoft/WindowsAppRuntime/1/8 in microsoft/winget-pkgs; 1.8.9 = 8000.879.2017.0).
  # The MSIX's MinVersion must not exceed this or winget installs fail on dependency resolution.
  WINGET_WINDOWSAPPRUNTIME_MAX_VERSION: 8000.879.2017.0

jobs:
  build-sign-release:
    name: Build, sign, and release MSIX
    runs-on: windows-latest
    environment: windows-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set release version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }

          if ($tag -notmatch '^v(?<base>\d+\.\d+\.\d+)(?:\.(?<revision>\d+))?-windows$') {
            throw "Windows release tags must look like v1.2.3-windows or v1.2.3.4-windows. Got '$tag'."
          }

          $revision = if ($Matches.revision) { $Matches.revision } else { "0" }
          $packageVersion = "$($Matches.base).$revision"
          $assetVersion = if ($Matches.revision) { "$($Matches.base).$revision" } else { $Matches.base }

          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV
          "ASSET_VERSION=$assetVersion" >> $env:GITHUB_ENV

      - name: Stamp package manifest version
        shell: pwsh
        run: |
          $manifestPath = "windows/src/TinyClips.App/Package.appxmanifest"
          $content = Get-Content $manifestPath -Raw
          $content = $content -creplace '(<Identity[\s\S]*?Version=")[^"]+(")', "`${1}$env:PACKAGE_VERSION`${2}"
          Set-Content -Path $manifestPath -Value $content -Encoding UTF8

      - name: Build and package MSIX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null

          # Framework-dependent MSIX (small package). The app does NOT bundle the .NET or
          # Windows App SDK runtimes; instead they are declared as winget PackageDependencies
          # in the installer manifest (Microsoft.DotNet.DesktopRuntime.10 and
          # Microsoft.WindowsAppRuntime.1.8). winget installs those dependency packages before
          # the app, and the Windows App SDK runtime is also auto-acquired by the OS on machines
          # with the Store/App Installer. Validate locally with
          # windows/packaging/sandbox/Invoke-SandboxValidation.ps1 (installs the runtimes in a fresh
          # Windows Sandbox first) and on ARM64 via the Windows Launch Smoke workflow.
          $platforms = @(
            @{ Platform = "x64";   Rid = "win-x64";   Asset = "x64" }
            @{ Platform = "ARM64"; Rid = "win-arm64"; Asset = "arm64" }
          )

          foreach ($p in $platforms) {
            $packageDir = "artifacts/windows/package/$($p.Asset)"
            New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
            $packageDirFull = (Resolve-Path $packageDir).Path + [IO.Path]::DirectorySeparatorChar
            $stableReleaseBase = "https://github.com/jamesmontemagno/tiny-clips/releases/download/windows-latest"
            $packageUri = "https://github.com/jamesmontemagno/tiny-clips/releases/download/$env:RELEASE_TAG/TinyClips-$env:ASSET_VERSION-$($p.Asset).msix"
            $appInstallerUri = "$stableReleaseBase/TinyClips-$($p.Asset).appinstaller"

            & ./windows/packaging/New-AppInstaller.ps1 `
              -ManifestPath windows/src/TinyClips.App/Package.appxmanifest `
              -ManifestOutputPath windows/src/TinyClips.App/Package.AutoUpdate.appxmanifest `
              -AppInstallerPath windows/src/TinyClips.App/install.appinstaller `
              -Architecture $p.Asset `
              -PackageUri $packageUri `
              -AppInstallerUri $appInstallerUri
            Copy-Item windows/src/TinyClips.App/install.appinstaller "artifacts/windows/TinyClips-$($p.Asset).appinstaller" -Force

            dotnet build $env:APP_PROJECT `
              -c Release `
              -p:Platform=$($p.Platform) `
              -p:RuntimeIdentifier=$($p.Rid) `
              -p:SelfContained=false `
              -p:WindowsAppSDKSelfContained=false `
              -p:EnableMsixTooling=true `
              -p:GenerateAppxPackageOnBuild=true `
              -p:AppxPackageDir=$packageDirFull `
              -p:AppxBundle=Never `
              -p:UapAppxPackageBuildMode=SideloadOnly `
              -p:AppxPackageSigningEnabled=false `
              -p:TinyClipsAutoUpdateBuild=true `
              -v:minimal
            if ($LASTEXITCODE -ne 0) { throw "MSIX build failed for $($p.Platform)." }

            $produced = Get-ChildItem $packageDir -Recurse -Filter *.msix |
              Where-Object { $_.Name -notmatch 'symbols' } |
              Select-Object -First 1
            if (-not $produced) { throw "No MSIX produced for $($p.Platform)." }

            # Guard against silently shipping the wrong kind of package. Unpack the MSIX and
            # assert it is genuinely framework-dependent: (1) the AppxManifest declares the
            # WindowsAppRuntime framework dependency (so the declared winget dependency matches
            # the package), and (2) the payload does NOT contain the .NET runtime (coreclr.dll),
            # confirming the .NET runtime is framework-dependent and delivered via the declared
            # Microsoft.DotNet.DesktopRuntime.10 winget dependency.
            $verifyDir = Join-Path $packageDir "verify"
            Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue
            $zipCopy = "$($produced.FullName).zip"
            Copy-Item $produced.FullName $zipCopy -Force
            Expand-Archive $zipCopy -DestinationPath $verifyDir -Force

            $appxManifest = Get-Content (Join-Path $verifyDir "AppxManifest.xml") -Raw
            if ($appxManifest -notmatch '<PackageDependency[^>]*Name="Microsoft\.WindowsAppRuntime') {
              throw "Framework-dependent MSIX for $($p.Platform) is missing the WindowsAppRuntime framework dependency."
            }

            # The declared winget dependency Microsoft.WindowsAppRuntime.1.8 can only deliver the
            # runtime versions published in winget-pkgs. If the SDK bump raised the package's
            # MinVersion past that, every winget install fails with a missing-dependency error.
            $runtimeDependency = [regex]::Match($appxManifest, '<PackageDependency[^>]*Name="Microsoft\.WindowsAppRuntime\.1\.8"[^>]*MinVersion="([^"]+)"')
            if (-not $runtimeDependency.Success) { throw "Could not read the WindowsAppRuntime.1.8 MinVersion for $($p.Platform)." }
            $minVersion = [version]$runtimeDependency.Groups[1].Value
            $wingetMax = [version]$env:WINGET_WINDOWSAPPRUNTIME_MAX_VERSION
            if ($minVersion -gt $wingetMax) {
              throw "MSIX for $($p.Platform) requires WindowsAppRuntime.1.8 >= $minVersion, but winget's Microsoft.WindowsAppRuntime.1.8 only provides up to $wingetMax. Pin Microsoft.WindowsAppSDK to a version whose runtime winget ships (see the csproj comment), or raise WINGET_WINDOWSAPPRUNTIME_MAX_VERSION after winget-pkgs publishes the newer runtime."
            }
            "$($p.Platform): WindowsAppRuntime.1.8 MinVersion $minVersion <= winget-available $wingetMax"

            if (Get-ChildItem $verifyDir -Recurse -Filter "coreclr.dll" -ErrorAction SilentlyContinue) {
              throw "MSIX for $($p.Platform) bundles the .NET runtime (coreclr.dll) - expected a framework-dependent (SelfContained=false) build."
            }

            [xml]$packagedManifest = $appxManifest
            $manifestNamespaces = [Xml.XmlNamespaceManager]::new($packagedManifest.NameTable)
            $manifestNamespaces.AddNamespace("foundation", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
            $manifestNamespaces.AddNamespace("uap13", "http://schemas.microsoft.com/appx/manifest/uap/windows10/13")
            $appInstallerDeclaration = $packagedManifest.SelectSingleNode(
              "/foundation:Package/foundation:Properties/uap13:AutoUpdate/uap13:AppInstaller",
              $manifestNamespaces
            )
            if (-not $appInstallerDeclaration -or $appInstallerDeclaration.File -ne "install.appinstaller") {
              throw "Direct MSIX for $($p.Platform) is missing the uap13 AutoUpdate declaration."
            }

            $embeddedAppInstallerPath = Join-Path $verifyDir "install.appinstaller"
            if (-not (Test-Path $embeddedAppInstallerPath)) {
              throw "Direct MSIX for $($p.Platform) does not contain install.appinstaller."
            }

            [xml]$embeddedAppInstaller = Get-Content $embeddedAppInstallerPath -Raw
            $appInstallerNamespaces = [Xml.XmlNamespaceManager]::new($embeddedAppInstaller.NameTable)
            $appInstallerNamespaces.AddNamespace("ai", "http://schemas.microsoft.com/appx/appinstaller/2018")
            $appInstallerRoot = $embeddedAppInstaller.SelectSingleNode("/ai:AppInstaller", $appInstallerNamespaces)
            $mainPackage = $embeddedAppInstaller.SelectSingleNode("/ai:AppInstaller/ai:MainPackage", $appInstallerNamespaces)
            $onLaunch = $embeddedAppInstaller.SelectSingleNode("/ai:AppInstaller/ai:UpdateSettings/ai:OnLaunch", $appInstallerNamespaces)
            $backgroundTask = $embeddedAppInstaller.SelectSingleNode("/ai:AppInstaller/ai:UpdateSettings/ai:AutomaticBackgroundTask", $appInstallerNamespaces)

            if ($appInstallerRoot.Version -ne $env:PACKAGE_VERSION -or $mainPackage.Version -ne $env:PACKAGE_VERSION) {
              throw "App Installer version for $($p.Platform) does not match $env:PACKAGE_VERSION."
            }
            if ($mainPackage.Name -ne "Refractored.TinyClips" -or
                $mainPackage.Publisher -ne "CN=Refractored LLC, O=Refractored LLC, L=Seattle, S=Washington, C=US" -or
                $mainPackage.ProcessorArchitecture -ne $p.Asset -or
                $mainPackage.Uri -ne $packageUri -or
                $appInstallerRoot.Uri -ne $appInstallerUri) {
              throw "App Installer identity or stable URL is invalid for $($p.Platform)."
            }
            if (-not $onLaunch -or $onLaunch.HoursBetweenUpdateChecks -ne "24") {
              throw "App Installer for $($p.Platform) must check on launch about every 24 hours."
            }
            if (-not $backgroundTask) {
              throw "App Installer for $($p.Platform) must check for updates in the background."
            }

            $standaloneAppInstallerPath = "artifacts/windows/TinyClips-$($p.Asset).appinstaller"
            if ((Get-FileHash $embeddedAppInstallerPath).Hash -ne (Get-FileHash $standaloneAppInstallerPath).Hash) {
              throw "Embedded and standalone App Installer files differ for $($p.Platform)."
            }
            Remove-Item $zipCopy -Force -ErrorAction SilentlyContinue
            Remove-Item $verifyDir -Recurse -Force -ErrorAction SilentlyContinue

            Copy-Item $produced.FullName "artifacts/windows/TinyClips-$env:ASSET_VERSION-$($p.Asset).msix" -Force
          }

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Artifact Signing client
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/tools | Out-Null
          $nuget = Join-Path (Resolve-Path artifacts/tools) "nuget.exe"
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nuget
          & $nuget install Microsoft.ArtifactSigning.Client -OutputDirectory artifacts/tools -ExcludeVersion -NonInteractive

      - name: Sign MSIX packages
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$signtool) {
            throw "SignTool x64 was not found."
          }

          $dlib = Get-ChildItem artifacts/tools/Microsoft.ArtifactSigning.Client -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\bin\\x64\\' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$dlib) {
            throw "Azure.CodeSigning.Dlib.dll x64 was not found."
          }

          $metadataPath = Join-Path (Resolve-Path artifacts/windows) "artifact-signing-metadata.json"
          @{
            Endpoint = "${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}"
            CodeSigningAccountName = "${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}"
            CertificateProfileName = "${{ secrets.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}"
            CorrelationId = "${{ github.repository }}-${{ github.run_id }}"
            ExcludeCredentials = @(
              "ManagedIdentityCredential",
              "WorkloadIdentityCredential",
              "SharedTokenCacheCredential",
              "VisualStudioCredential",
              "VisualStudioCodeCredential",
              "AzurePowerShellCredential",
              "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential"
            )
          } | ConvertTo-Json | Set-Content -Path $metadataPath -Encoding UTF8

          & $signtool sign /v /fd SHA256 /tr $env:SIGNTOOL_TIMESTAMP_URL /td SHA256 /dlib "$dlib" /dmdf "$metadataPath" "artifacts/windows/TinyClips-$env:ASSET_VERSION-x64.msix"
          & $signtool sign /v /fd SHA256 /tr $env:SIGNTOOL_TIMESTAMP_URL /td SHA256 /dlib "$dlib" /dmdf "$metadataPath" "artifacts/windows/TinyClips-$env:ASSET_VERSION-arm64.msix"

      - name: Verify signatures
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          & $signtool verify /pa /v "artifacts/windows/TinyClips-$env:ASSET_VERSION-x64.msix"
          & $signtool verify /pa /v "artifacts/windows/TinyClips-$env:ASSET_VERSION-arm64.msix"

      - name: Run WACK
        shell: pwsh
        run: |
          $appcert = "${env:ProgramFiles(x86)}\Windows Kits\10\App Certification Kit\appcert.exe"
          if (!(Test-Path $appcert)) {
            throw "Windows App Certification Kit appcert.exe was not found at '$appcert'."
          }

          New-Item -ItemType Directory -Force -Path artifacts/windows/wack | Out-Null
          $wackDir = Resolve-Path artifacts/windows/wack
          & $appcert test -appxpackagepath (Resolve-Path "artifacts/windows/TinyClips-$env:ASSET_VERSION-x64.msix") -reportoutputpath (Join-Path $wackDir "TinyClips-$env:ASSET_VERSION-x64-wack.xml")
          & $appcert test -appxpackagepath (Resolve-Path "artifacts/windows/TinyClips-$env:ASSET_VERSION-arm64.msix") -reportoutputpath (Join-Path $wackDir "TinyClips-$env:ASSET_VERSION-arm64-wack.xml")

          foreach ($report in Get-ChildItem artifacts/windows/wack/*.xml) {
            [xml]$xml = Get-Content $report.FullName
            if ($xml.REPORT.OVERALL_RESULT -ne "PASS") {
              throw "WACK failed for $($report.Name): $($xml.REPORT.OVERALL_RESULT)"
            }
          }

      - name: Compute winget hashes
        shell: pwsh
        run: |
          $x64Package = "artifacts/windows/TinyClips-$env:ASSET_VERSION-x64.msix"
          $arm64Package = "artifacts/windows/TinyClips-$env:ASSET_VERSION-arm64.msix"

          $x64InstallerHash = (winget hash $x64Package | Select-String 'InstallerSha256:' | Select-Object -Last 1).ToString().Split(':')[1].Trim()
          $x64SignatureHash = (winget hash --msix $x64Package | Select-String 'SignatureSha256:' | Select-Object -Last 1).ToString().Split(':')[1].Trim()
          $arm64InstallerHash = (winget hash $arm64Package | Select-String 'InstallerSha256:' | Select-Object -Last 1).ToString().Split(':')[1].Trim()
          $arm64SignatureHash = (winget hash --msix $arm64Package | Select-String 'SignatureSha256:' | Select-Object -Last 1).ToString().Split(':')[1].Trim()

          "X64_INSTALLER_SHA256=$x64InstallerHash" >> $env:GITHUB_ENV
          "X64_SIGNATURE_SHA256=$x64SignatureHash" >> $env:GITHUB_ENV
          "ARM64_INSTALLER_SHA256=$arm64InstallerHash" >> $env:GITHUB_ENV
          "ARM64_SIGNATURE_SHA256=$arm64SignatureHash" >> $env:GITHUB_ENV

          @"
          PackageVersion: $env:PACKAGE_VERSION
          PackageFamilyName: $env:PACKAGE_FAMILY_NAME

          x64 InstallerSha256: $x64InstallerHash
          x64 SignatureSha256: $x64SignatureHash

          arm64 InstallerSha256: $arm64InstallerHash
          arm64 SignatureSha256: $arm64SignatureHash
          "@ | Set-Content -Path artifacts/windows/winget-hashes.txt -Encoding UTF8

      - name: Generate winget manifest artifact
        shell: pwsh
        run: |
          $wingetDir = "artifacts/windows/winget"
          New-Item -ItemType Directory -Force -Path $wingetDir | Out-Null
          Copy-Item windows/packaging/winget/Refractored.TinyClips.yaml $wingetDir
          Copy-Item windows/packaging/winget/Refractored.TinyClips.locale.en-US.yaml $wingetDir

          foreach ($manifest in Get-ChildItem $wingetDir/*.yaml) {
            $content = Get-Content $manifest.FullName -Raw
            $content = $content -replace 'PackageVersion: .*', "PackageVersion: $env:PACKAGE_VERSION"
            Set-Content -Path $manifest.FullName -Value $content -Encoding UTF8
          }

          @"
          # yaml-language-server: `$schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json
          # Installer manifest for the signed, framework-dependent MSIX produced by the Windows
          # Release workflow. The package does NOT bundle the .NET or Windows App SDK runtimes;
          # they are declared below as winget package dependencies so winget installs them before
          # the app. Do not set Scope here: the dependency installers are machine-scope/unknown
          # scope, and forcing user scope makes winget reject them during validation.
          PackageIdentifier: Refractored.TinyClips
          PackageVersion: $env:PACKAGE_VERSION
          MinimumOSVersion: 10.0.22000.0
          InstallerType: msix
          InstallModes:
            - silent
            - silentWithProgress
          PackageFamilyName: $env:PACKAGE_FAMILY_NAME
          Dependencies:
            PackageDependencies:
              - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.10
              - PackageIdentifier: Microsoft.WindowsAppRuntime.1.8
          Installers:
            - Architecture: x64
              InstallerUrl: https://github.com/jamesmontemagno/tiny-clips/releases/download/$env:RELEASE_TAG/TinyClips-$env:ASSET_VERSION-x64.msix
              InstallerSha256: $env:X64_INSTALLER_SHA256
              SignatureSha256: $env:X64_SIGNATURE_SHA256
            - Architecture: arm64
              InstallerUrl: https://github.com/jamesmontemagno/tiny-clips/releases/download/$env:RELEASE_TAG/TinyClips-$env:ASSET_VERSION-arm64.msix
              InstallerSha256: $env:ARM64_INSTALLER_SHA256
              SignatureSha256: $env:ARM64_SIGNATURE_SHA256
          ManifestType: installer
          ManifestVersion: 1.12.0
          "@ | ForEach-Object { $_ -replace '^          ', '' } |
            Set-Content -Path (Join-Path $wingetDir "Refractored.TinyClips.installer.yaml") -Encoding UTF8

          # winget validate returns a non-zero exit code for non-fatal warnings as well as
          # for errors. The GitHub runner can ship an older winget that doesn't recognize the
          # 1.12.0 schema header and warns about it, even though the manifest is valid (and the
          # always-current winget-pkgs validation accepts it). Distinguish success-with-warnings
          # from a real failure by inspecting the output text rather than the exit code.
          $validateOutput = winget validate --manifest $wingetDir 2>&1 | Out-String
          Write-Host $validateOutput
          if ($validateOutput -notmatch 'Manifest validation succeeded') {
            throw "winget validate failed:`n$validateOutput"
          }
          # winget leaves a non-zero $LASTEXITCODE for warnings; the GitHub pwsh shell appends
          # `exit $LASTEXITCODE`, so reset it after confirming validation succeeded.
          $global:LASTEXITCODE = 0

      - name: Generate release notes
        shell: pwsh
        run: |
          $lines = Get-Content windows/CHANGELOG.md
          $escapedTag = [regex]::Escape($env:RELEASE_TAG)
          $start = $null
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^## \[$escapedTag\]") {
              $start = $i
              break
            }
          }

          if ($null -ne $start) {
            $end = $lines.Count
            for ($i = $start + 1; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^## ') {
                $end = $i
                break
              }
            }
            $notes = @($lines[($start + 1)..($end - 1)] | Where-Object { $_ -ne "" })
          } else {
            $notes = @("Windows release $env:PACKAGE_VERSION.")
          }

          $notes += ""
          $notes += "## Install"
          $notes += 'For direct installation with automatic updates, download the `.appinstaller` for your architecture below. It always resolves through the stable update channel, so opening one from an older release installs the current Windows version. Windows checks periodically in the background and on launch when about 24 hours have passed.'
          $notes += 'Direct installation requires the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0); winget installs that prerequisite automatically.'
          $notes += ""
          $notes += "Tiny Clips is also published in the [winget community repository](https://github.com/microsoft/winget-pkgs). Install it from any Windows 11 terminal:"
          $notes += ""
          $notes += '```text'
          $notes += 'winget install Refractored.TinyClips'
          $notes += '```'
          $notes += ""
          $notes += 'winget installs the same auto-updating direct MSIX. `winget upgrade` and App Installer can both update its package family.'

          $notes += ""
          $notes += "## Release validation"
          $notes += "- Azure Artifact Signing completed for x64 and ARM64 MSIX packages."
          $notes += "- SignTool verification passed for x64 and ARM64 MSIX packages."
          $notes += "- WACK overall result passed for x64 and ARM64 MSIX packages."
          $notes += ""
          $notes += "## winget hashes"
          $notes += '```text'
          $notes += (Get-Content artifacts/windows/winget-hashes.txt)
          $notes += '```'

          $notes | Set-Content -Path artifacts/windows/release-notes.md -Encoding UTF8

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            artifacts/windows/*.msix
            artifacts/windows/*.appinstaller
            artifacts/windows/*.txt
            artifacts/windows/winget/*.yaml
            artifacts/windows/wack/*.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: Tiny Clips for Windows ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: artifacts/windows/release-notes.md
          files: |
            artifacts/windows/*.msix
            artifacts/windows/*.appinstaller
            artifacts/windows/winget-hashes.txt
            artifacts/windows/wack/*.xml
          overwrite_files: false
          preserve_order: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'beta') || contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote stable direct-install assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rollingDir = "artifacts/windows/rolling"
          New-Item -ItemType Directory -Force -Path $rollingDir | Out-Null
          Copy-Item "artifacts/windows/TinyClips-x64.appinstaller" $rollingDir -Force
          Copy-Item "artifacts/windows/TinyClips-arm64.appinstaller" $rollingDir -Force

          $rollingReleaseCreated = $false
          gh release view windows-latest --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create windows-latest `
              --repo "${{ github.repository }}" `
              --target "${{ github.sha }}" `
              --title "Tiny Clips for Windows (auto-update channel)" `
              --notes "Stable App Installer metadata for direct MSIX installs. Each file references the signed, immutable MSIX in its versioned Windows release. The source archives identify only the commit that created this channel; use the App Installer assets for current channel state." `
              --latest=false
            if ($LASTEXITCODE -ne 0) { throw "Could not create the windows-latest rolling release." }
            $rollingReleaseCreated = $true
          }

          $currentDir = "artifacts/windows/current-appinstaller"
          New-Item -ItemType Directory -Force -Path $currentDir | Out-Null
          if (-not $rollingReleaseCreated) {
            $downloadedCurrent = $false
            for ($attempt = 1; $attempt -le 3 -and -not $downloadedCurrent; $attempt++) {
              gh release download windows-latest `
                --repo "${{ github.repository }}" `
                --pattern "*.appinstaller" `
                --dir $currentDir `
                --clobber
              $downloadedCurrent = $LASTEXITCODE -eq 0
              if (-not $downloadedCurrent -and $attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            if (-not $downloadedCurrent) {
              throw "Could not read the existing windows-latest channel; refusing to promote without a downgrade check."
            }
            foreach ($architecture in @("x64", "arm64")) {
              if (-not (Test-Path "$currentDir/TinyClips-$architecture.appinstaller")) {
                throw "The existing windows-latest channel is missing its $architecture App Installer; repair it before promoting."
              }
            }
            foreach ($currentInstaller in Get-ChildItem $currentDir -Filter *.appinstaller) {
              [xml]$current = Get-Content $currentInstaller.FullName -Raw
              $currentVersion = [version]$current.AppInstaller.Version
              $candidateVersion = [version]$env:PACKAGE_VERSION
              if ($currentVersion -gt $candidateVersion) {
                throw "Refusing to downgrade windows-latest from $($current.AppInstaller.Version) to $env:PACKAGE_VERSION."
              }
              $candidateInstaller = Join-Path $rollingDir $currentInstaller.Name
              if ($currentVersion -eq $candidateVersion -and
                  (Get-FileHash $currentInstaller.FullName).Hash -ne (Get-FileHash $candidateInstaller).Hash) {
                throw "Refusing to replace windows-latest version $env:PACKAGE_VERSION with different App Installer metadata."
              }
            }
          }
          $global:LASTEXITCODE = 0

          function Publish-AppInstallers([string] $sourceDirectory) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload windows-latest `
                "$sourceDirectory/TinyClips-x64.appinstaller" `
                "$sourceDirectory/TinyClips-arm64.appinstaller" `
                --repo "${{ github.repository }}" `
                --clobber 2>&1 | ForEach-Object { Write-Host $_ }
              if ($LASTEXITCODE -eq 0) { return $true }
              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }
            return $false
          }

          function Restore-PreviousChannel {
            if ($rollingReleaseCreated) {
              gh release delete windows-latest --repo "${{ github.repository }}" --cleanup-tag --yes
              return
            }
            if (-not (Publish-AppInstallers $currentDir)) {
              throw "Promotion failed and the previous windows-latest channel could not be restored."
            }
          }

          if (-not (Publish-AppInstallers $rollingDir)) {
            Restore-PreviousChannel
            throw "Could not publish rolling App Installer assets after three attempts."
          }

          try {
            $verifyDir = "artifacts/windows/verify-appinstaller"
            New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
            gh release download windows-latest `
              --repo "${{ github.repository }}" `
              --pattern "*.appinstaller" `
              --dir $verifyDir `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not download rolling App Installer assets for verification." }

            foreach ($architecture in @("x64", "arm64")) {
              $local = "$rollingDir/TinyClips-$architecture.appinstaller"
              $publishedFile = "$verifyDir/TinyClips-$architecture.appinstaller"
              if (-not (Test-Path $publishedFile) -or
                  (Get-FileHash $local).Hash -ne (Get-FileHash $publishedFile).Hash) {
                throw "Published $architecture App Installer does not match the release artifact."
              }
            }
          }
          catch {
            Restore-PreviousChannel
            throw
          }
