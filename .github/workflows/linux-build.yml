name: Linux Flatpak

on:
  pull_request:
    paths:
      - 'linux/**'
      - 'shared/automation/**'
      - '.github/workflows/linux-build.yml'
  push:
    branches: [main, develop]
    paths:
      - 'linux/**'
      - 'shared/automation/**'
      - '.github/workflows/linux-build.yml'
  workflow_dispatch:
    inputs:
      arm64:
        description: 'Build a native ARM64 tester bundle (e.g. for a Windows on Arm Hyper-V guest) instead of x86-64'
        type: boolean
        default: false
      endurance:
        description: 'Also record 30 minutes of synthetic video and mixed audio from the installed Flatpak'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  flatpak:
    runs-on: ${{ inputs.arm64 && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 45
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # flatpak-builder uses nested Bubblewrap sandboxes on the disposable runner.
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stage the shared automation contract
        run: sh linux/prepare-flatpak.sh
      - name: Build, test and upload the development Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: linux/com.refractored.tinyclips.Devel.json
          branch: devel
          arch: ${{ inputs.arm64 && 'aarch64' || 'x86_64' }}
          bundle: TinyClips-Preview.flatpak
          artifact-name: TinyClips-Preview-${{ inputs.arm64 && 'aarch64' || 'x86_64' }}
          run-tests: true
          cache: false

  installed-bundle-smoke:
    needs: flatpak
    runs-on: ${{ inputs.arm64 && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: TinyClips-Preview-${{ inputs.arm64 && 'aarch64' || 'x86_64' }}
      - name: Install the test bundle in a clean user installation
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y flatpak weston dbus-daemon ffmpeg
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive ./TinyClips-Preview.flatpak
      - name: Map the installed GTK window on headless Wayland (no capture)
        shell: 'dbus-run-session -- bash -e {0}'
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=wayland-0
          weston --backend=headless-backend.so --socket="$WAYLAND_DISPLAY" --idle-time=0 &
          compositor=$!
          trap 'kill "$compositor" 2>/dev/null || true' EXIT
          for _ in {1..50}; do
            test ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || break
            kill -0 "$compositor"
            sleep .1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          flatpak run --env=GSK_RENDERER=cairo com.refractored.tinyclips.Devel --self-test
      - name: Record, finalize and independently decode synthetic media
        env:
          SECONDS_TO_RECORD: ${{ inputs.endurance && '1800' || '5' }}
        run: |
          set -euo pipefail
          dir="$HOME/.var/app/com.refractored.tinyclips.Devel/data/validation"
          install -d -m 700 "$dir"
          dbus-run-session -- flatpak run --command=tinyclips-media-check com.refractored.tinyclips.Devel \
            --synthetic --seconds "$SECONDS_TO_RECORD" --output-dir "$dir" --audio --pause 2>&1 | tee media-check.log
          shopt -s nullglob
          files=("$dir"/*.mp4)
          test "${#files[@]}" -eq 1
          python3 linux/tests/verify_recording.py "${files[0]}" --seconds "$SECONDS_TO_RECORD" --audio --synthetic-tones --rss-log media-check.log | tee media-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Linux-media-validation
          path: |
            media-check.log
            media-result.json
          if-no-files-found: ignore
